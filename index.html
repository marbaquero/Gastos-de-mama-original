
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Mamá</title>
    <!-- Importamos una fuente moderna de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --danger-color: #ff7675;
            --success-color: #55efc4;
            --bg-color: #f0f2f5;
            --text-color: #2d3436;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Formulario */
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 30px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #eee;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-family: inherit;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
        }

        .btn-add:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        /* Tabla */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #f8f9fa;
            color: #636e72;
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            opacity: 0.8;
            background-color: #d63031;
        }

        /* Total */
        .total-section {
            margin-top: 30px;
            text-align: right;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            padding: 20px;
            border-top: 2px solid #eee;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💰 Control de Gastos</h1>

        <div class="input-group">
            <input type="text" id="description" placeholder="Descripción (ej. Luz)">
            <input type="number" id="amount" placeholder="Monto ($)">
            <input type="date" id="date">
            <button class="btn-add" onclick="addExpense()">Agregar</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <!-- Los gastos se cargarán aquí -->
                </tbody>
            </table>
        </div>

        <div class="total-section">
            Total: <span id="total-amount">$0.00</span>
        </div>
    </div>

    <script>
        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadExpenses();
            // Establecer fecha de hoy por defecto
            document.getElementById('date').valueAsDate = new Date();
        });

        function addExpense() {
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;

            if (!description || !amount || !date) {
                alert("Por favor, completa todos los campos");
                return;
            }

            const expense = {
                id: Date.now(),
                description,
                amount: parseFloat(amount),
                date
            };

            let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            expenses.push(expense);
            localStorage.setItem('expenses', JSON.stringify(expenses));

            // Limpiar inputs
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            
            renderExpenses();
        }

        function deleteExpense(id) {
            let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            expenses = expenses.filter(exp => exp.id !== id);
            localStorage.setItem('expenses', JSON.stringify(expenses));
            renderExpenses();
        }

        function renderExpenses() {
            const list = document.getElementById('expense-list');
            const totalEl = document.getElementById('total-amount');
            const expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
            
            list.innerHTML = '';
            let total = 0;

            // Ordenar por fecha (más reciente primero)
            expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            expenses.forEach(exp => {
                total += exp.amount;
                list.innerHTML += 
                    <tr>
                        <td>${exp.date}</td>
                        <td>${exp.description}</td>
                        <td><strong>$${exp.amount.toFixed(2)}</strong></td>
                        <td><button class="btn-delete" onclick="deleteExpense(${exp.id})">Eliminar</button></td>
                    </tr>
                ;
            });

            totalEl.innerText = $${total.toFixed(2)};
        }

        function loadExpenses() {
            renderExpenses();
        }
    </script>
</body>
</html>
