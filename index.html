<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos de Mamá — Cuidadora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}
.w{max-width:640px;margin:auto;padding:14px}.c{background:#fff;border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:26px}.bal{font-size:36px;font-weight:800}.mut{color:#68707d;font-size:14px}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;font:inherit;border-radius:12px}
input,select{padding:13px;border:1px solid #ccd0d5;background:#fff}button{padding:14px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}
.msg{padding:10px;border-radius:10px;background:#ecfdf3;color:#067647;margin:10px 0}.err{background:#fef3f2;color:#b42318}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.m{text-align:right}.dep{color:#067647}.gas{color:#b42318}
.btn-small{padding:7px 9px;margin:0;width:auto;font-size:13px}
.btn-recibo{background:#111;color:#fff;padding:6px 10px;font-size:12px;border-radius:8px;width:auto}
</style>
</head>
<body>
<div class="w">
<h1>Gastos de Mamá — Cuidadora</h1>
<div class="c"><div class="mut">Saldo disponible</div><div class="bal" id="saldo">$0.00</div><div class="mut">Total gastos: <span id="tg">$0.00</span></div></div>
<div class="c"><h2>Registrar gasto</h2>
<label>¿Quién registra?</label><select id="quien"><option value="Aracely">Aracely</option><option value="Genesis">Genesis</option><option value="Ibeth">Ibeth</option></select>
<label>Fecha</label><input type="date" id="f-fecha">
<label>Monto</label><input type="number" step="0.01" inputmode="decimal" id="f-monto" placeholder="0.00">
<label>Descripción</label><input type="text" id="f-desc" placeholder="Ej: Medicinas, comida...">
<label>Recibo (foto, opcional)</label><input type="file" id="f-file" accept="image/*" style="border:none;padding:0">
<button id="btn-save" style="margin-top:14px">Guardar gasto</button>
<div id="msg" class="msg hide"></div></div>
<div class="c"><h2>Últimos movimientos</h2><div id="lista"></div><button id="btn-refresh" style="background:#e5e7eb;color:#111;margin-top:10px">Actualizar</button></div>
</div>
<script>
const SUPABASE_URL='https://fftnffmttuzfftntzzhu.supabase.co';
const SUPABASE_KEY='sb_publishable_f5py08cOv3Bdo0Yvm6lmbA_VBxnbEsP';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const HOUSEHOLD_ID='7f3a9c2e-4b5d-4a8e-9f1c-2d3e4f5a6b7c';
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
document.getElementById('f-fecha').valueAsDate=new Date();
function note(t,e=false){const m=document.getElementById('msg');m.className='msg'+(e?' err':'');m.textContent=t;m.classList.remove('hide');setTimeout(()=>m.classList.add('hide'),4000);}
async function load(){
  const {data,error}=await sb.from('expense_movements').select('*').eq('household_id',HOUSEHOLD_ID).order('created_at',{ascending:false}).limit(100);
  if(error){note('No se pudo cargar: '+error.message,true);return;}
  let g=0,d=0;(data||[]).forEach(r=>{if(r.type==='gasto')g+=Number(r.amount); if(r.type==='deposito')d+=Number(r.amount);});
  document.getElementById('saldo').textContent=money(d-g);
  document.getElementById('tg').textContent=money(g);
  const list=document.getElementById('lista');
  if(!data||!data.length){list.innerHTML='<p class="mut">Sin movimientos todavía.</p>';return;}
  list.innerHTML='<table><tr><th>Fecha</th><th>Descripción</th><th class="m">Monto</th><th>Recibo</th></tr>'+data.map(x=>`<tr><td>${new Date(x.movement_date).toLocaleDateString()}</td><td>${(x.description||'')}${x.registered_by?` <span class="mut">· ${x.registered_by}</span>`:''}</td><td class="m ${x.type==='deposito'?'dep':'gas'}">${x.type==='deposito'?'+':'-'}${money(x.amount)}</td><td>${x.receipt_path?`<button class="btn-recibo" onclick="verRecibo('${x.receipt_path}')">Ver</button>`:''}</td></tr>`).join('')+'</table>';
}
window.verRecibo=async(path)=>{const {data,error}=await sb.storage.from('recibos').createSignedUrl(path,300); if(error) return alert(error.message); window.open(data.signedUrl,'_blank');};
document.getElementById('btn-save').onclick=async()=>{
  const fecha=document.getElementById('f-fecha').value;
  const monto=parseFloat(document.getElementById('f-monto').value);
  const desc=document.getElementById('f-desc').value.trim();
  const quien=document.getElementById('quien').value;
  const file=document.getElementById('f-file').files[0];
  if(!fecha||!monto||monto<=0) return note('Ingresa fecha y monto válido.',true);
  const btn=document.getElementById('btn-save'); btn.disabled=true; btn.textContent='Guardando...';
  try{
    const {data:ins,error}=await sb.from('expense_movements').insert({household_id:HOUSEHOLD_ID,movement_date:fecha,type:'gasto',amount:monto,description:desc||'Gasto',registered_by:quien}).select('id').single();
    if(error) throw error;
    if(file){
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const path=`${HOUSEHOLD_ID}/mov_${ins.id}_${Date.now()}.${ext}`;
      const {error:upErr}=await sb.storage.from('recibos').upload(path,file);
      if(upErr) throw upErr;
      await sb.from('expense_movements').update({receipt_path:path}).eq('id',ins.id).eq('household_id',HOUSEHOLD_ID);
    }
    document.getElementById('f-monto').value=''; document.getElementById('f-desc').value=''; document.getElementById('f-file').value='';
    note('Gasto guardado.'); await load();
  }catch(e){note('No se pudo guardar: '+e.message,true);}
  finally{btn.disabled=false; btn.textContent='Guardar gasto';}
};
document.getElementById('btn-refresh').onclick=load;
load(); setInterval(load,15000);
</script>
</body>
</html>
