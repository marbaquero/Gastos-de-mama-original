<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos de Mamá - Cuidadora</title>
<link rel="apple-touch-icon" href="icono-gastos-cuidadoras.png">
<link rel="icon" type="image/png" href="icono-gastos-cuidadoras.png">
<meta name="apple-mobile-web-app-title" content="Gastos Mamá">
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f5f7;color:#111}
.w{max-width:520px;margin:auto;padding:16px}
.c{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.saldo-label{color:#6b7280;font-size:14px}.saldo{font-size:36px;font-weight:900;margin:2px 0}
label{font-weight:700;display:block;margin:18px 0 8px;font-size:15px}
input,textarea{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:10px}
button{width:100%;padding:15px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:800;font-size:16px;margin-top:18px;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111;margin-top:8px}
.mut{color:#6b7280;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}td,th{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}
.monto-neg{color:#b91c1c;text-align:right;font-weight:600}
.badge{font-size:11px;background:#fef3c7;padding:3px 8px;border-radius:20px}
.edit-btn{width:auto;padding:6px 12px;background:#eef2ff;color:#3730a3;border-radius:8px;font-size:13px;margin:0}
.msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;display:none}
.msg.show{display:block}
.quien{display:flex;gap:8px}
.quien button{margin:0;padding:12px 8px;background:#e5e7eb;color:#111;font-size:15px}
.quien button.sel{background:#111;color:#fff}
</style>
</head>
<body>
<div id="msg" class="msg"></div>
<main class="w">
<h1 style="font-size:28px;margin:12px 4px">Gastos de Mamá</h1>
<div class="c"><div class="saldo-label">Saldo disponible</div><div class="saldo" id="saldo">$0.00</div></div>

<div class="c" id="formCard">
<h2 id="formTitle" style="margin:0 0 4px">Registrar gasto</h2>
<p class="mut" id="formSub">Agrega el gasto del día con su recibo si tienes.</p>

<label style="margin-top:14px">¿Quién registra?</label>
<div class="quien" id="quien"></div>

<label>Fecha <span class="mut" style="font-weight:400">— toca para cambiar</span></label>
<div style="display:flex;gap:8px">
<input id="f_fecha" type="date" style="flex:1">
<button type="button" id="btnHoy" style="width:auto;padding:10px 14px;margin:0;background:#eef2ff;color:#3730a3">Hoy</button>
<button type="button" id="btnAyer" style="width:auto;padding:10px 14px;margin:0;background:#eef2ff;color:#3730a3">Ayer</button>
</div>
<label>Monto</label><input id="f_monto" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<label>Descripción</label><textarea id="f_desc" placeholder="Ej: compras de casa, taxi, medicinas..."></textarea>
<label>Foto del recibo <span class="mut">(opcional) — tome una foto o elija una de su galería</span></label>
<input id="f_file" type="file" accept="image/*" capture="environment" style="display:none">
<button type="button" id="btnFoto" style="background:#eef2ff;color:#3730a3;border:2px dashed #a5b4fc">📷 Tomar foto del recibo</button>
<button type="button" id="btnGaleria" style="background:#f0fdf4;color:#166534;border:2px dashed #86efac;margin-top:8px">🖼️ Elegir de la galería</button>
<div id="previewFoto" style="display:none;margin-top:10px"><img id="imgPreview" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover"><p class="mut" id="fileName" style="margin-top:6px"></p><button type="button" id="btnQuitarFoto" class="secondary" style="padding:8px;font-size:13px;margin-top:8px">Quitar foto</button></div>
<div id="currentRecibo" class="mut" style="margin-top:8px;display:none"></div>

<button id="btnGuardar">Guardar gasto</button>
<button id="btnCancelar" class="secondary" style="display:none">Cancelar edición</button>
</div>

<div class="c"><h2 style="margin:0 0 12px">Últimos movimientos</h2><div id="lista"></div></div>
</main>

<script>
const SUPA_URL='https://fftnffmttuzfftntzzhu.supabase.co';
const SUPA_KEY='sb_publishable_f5py08cOv3Bdo0Yvm6lmbA_VBxnbEsP';
const H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const token=new URLSearchParams(location.search).get('t')||'';
let ctx=null;
let invalidToken=!token;

async function rpc(name,body){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(body||{})});
  if(!r.ok) throw Error(await r.text());
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}

async function loadContext(){
  try{
    ctx=await rpc('caregiver_context',{p_token:token});
    if(!ctx||ctx.error) throw Error('invalid');
    invalidToken=false;
    setQuien(ctx.caregiver_name);
    const q=document.getElementById('quien');
    if(q) q.style.display='none';
    await Promise.all([loadSaldo(),loadLista()]);
  }catch(e){
    console.error(e);
    invalidToken=true;
    const main=document.querySelector('main');
    if(main) main.innerHTML='<section style="padding:60px 0;text-align:center"><h1>Este enlace no funciona</h1><p class="mut">Pida a la familia un enlace nuevo.</p></section>';
  }
}
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);

$('f_fecha').value=today();

let editingId=null;
let editingReciboUrl=null;
let allData=[];
let quien=null;
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
function setQuien(q){
  quien=q; ls('gm_quien',q);
  document.querySelectorAll('#quien button').forEach(b=>b.classList.toggle('sel',b.dataset.q===q));
}
document.querySelectorAll('#quien button').forEach(b=>b.onclick=()=>setQuien(b.dataset.q));
if(ls('gm_quien')) setQuien(ls('gm_quien'));


function toast(t){const m=$('msg');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),3000)}

async function api(path,opts={}){
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opts,headers:{...H,...(opts.headers||{})}});
  if(!r.ok) throw Error(await r.text());
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}

async function verRecibo(id){
  if(!id) return;
  const w=window.open('','_blank');
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/caregiver-expense',{
      method:'POST',
      headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({action:'receipt',token,movement_id:id})
    });
    if(!r.ok) throw Error(await r.text());
    const j=await r.json();
    if(!j.url) throw Error('No signed URL');
    if(w) w.location.href=j.url; else window.location.href=j.url;
  }catch(e){
    console.error(e);
    if(w) w.close();
    toast('No se pudo abrir el recibo.');
  }
}

async function loadSaldo(){
  try{
    const data=await rpc('caregiver_expenses',{p_token:token,p_limit:500});
    let d=0,g=0; data.forEach(x=> x.type==='deposito'?d+=+x.amount:g+=+x.amount);
    $('saldo').textContent=money(d-g);
  }catch(e){console.error(e)}
}

async function loadLista(){
  try{
    const rows=await rpc('caregiver_expenses',{p_token:token,p_limit:200});
    allData=rows.map(x=>({
      id:x.id,
      fecha:x.movement_date,
      tipo:x.type,
      monto:x.amount,
      descripcion:x.description,
      recibo_url:x.receipt_path,
      registrado_por:x.registered_by,
      creado_en:x.created_at
    }));
    if(!allData.length){$('lista').innerHTML='<p class="mut">Sin movimientos.</p>';return}
    $('lista').innerHTML='<table><tr><th>Fecha</th><th>Descripción</th><th style="text-align:right">Monto</th><th></th></tr>'+
      allData.map(x=>`<tr>
        <td>${x.fecha}</td>
        <td>${x.descripcion||''}${x.registrado_por?` <span class="mut">· ${String(x.registrado_por).replace(/</g,'&lt;')}</span>`:''}</td>
        <td class="monto-neg">-${money(x.monto).replace('$','')}</td>
        <td><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">${x.recibo_url?`<button class="edit-btn" style="background:#111;color:#fff" onclick="verRecibo(${x.id})">📎 Recibo</button>`:''}</div></td>
      </tr>`).join('')+'</table>';
  }catch(e){console.error(e);$('lista').innerHTML='<p class="mut">Error cargando.</p>'}
}

window.editar=(id)=>{
  const item=allData.find(x=>x.id===id);
  if(!item) return;
  editingId=id;
  editingReciboUrl=item.recibo_url||null;
  $('f_fecha').value=item.fecha;
  $('f_monto').value=item.monto;
  $('f_desc').value=item.descripcion||'';
  $('formTitle').textContent='Editar gasto';
  $('formSub').textContent='Corrige el monto, fecha o descripción.';
  $('btnGuardar').textContent='Actualizar gasto';
  $('btnCancelar').style.display='block';
  $('f_file').value='';
  if(editingReciboUrl){
    $('currentRecibo').style.display='block';
    $('currentRecibo').textContent='Recibo actual guardado: '+editingReciboUrl+' (si no eliges otro, se mantiene)';
  }else{
    $('currentRecibo').style.display='none';
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

$('btnCancelar').onclick=()=>{
  editingId=null; editingReciboUrl=null;
  $('f_fecha').value=today(); $('f_monto').value=''; $('f_desc').value=''; $('f_file').value='';
  $('formTitle').textContent='Registrar gasto'; $('formSub').textContent='Agrega el gasto del día con su recibo si tienes.';
  $('btnGuardar').textContent='Guardar gasto'; $('btnCancelar').style.display='none'; $('currentRecibo').style.display='none';
}

$('btnGuardar').onclick=async()=>{
  const fecha=$('f_fecha').value;
  const monto=parseFloat($('f_monto').value);
  const desc=$('f_desc').value.trim();
  const file=$('f_file').files[0];
  if(invalidToken) return toast('Este enlace no es válido. Pida uno nuevo.');
  if(!quien) return toast('No se pudo identificar a la cuidadora.');
  if(!fecha || isNaN(monto) || monto<=0) return toast('Pon fecha y monto válido');
  if(fecha > today()) return toast('No se puede usar una fecha futura. Usa Hoy o una fecha pasada.');
  if(editingId) return toast('Para corregir un gasto, pida a la familia que lo edite en Gastos Admin.');
  $('btnGuardar').disabled=true; $('btnGuardar').textContent='Guardando...';
  try{
    const fd=new FormData();
    fd.append('token',token);
    fd.append('type','gasto');
    fd.append('amount',String(monto));
    fd.append('description',desc);
    fd.append('date',fecha);
    if(file) fd.append('receipt',file);
    const r=await fetch(SUPA_URL+'/functions/v1/caregiver-expense',{
      method:'POST',
      headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},
      body:fd
    });
    if(!r.ok) throw Error(await r.text());
    toast('Gasto guardado');
    $('btnCancelar').onclick();
    await Promise.all([loadSaldo(),loadLista()]);
  }catch(e){
    console.error(e);
    toast('Error: no se pudo guardar. Revisa internet o permisos.');
  }finally{
    $('btnGuardar').disabled=false;
    $('btnGuardar').textContent='Guardar gasto';
  }
}

$('btnFoto').onclick=()=>{ $('f_file').setAttribute('capture','environment'); $('f_file').click(); };
$('btnGaleria').onclick=()=>{ $('f_file').removeAttribute('capture'); $('f_file').click(); };
$('btnQuitarFoto').onclick=()=>{
  $('f_file').value='';
  $('previewFoto').style.display='none';
  $('imgPreview').src='';
  $('fileName').textContent='';
};
$('f_file').onchange=(e)=>{
  const file=e.target.files[0];
  if(!file) return;
  $('fileName').textContent=file.name + ' (' + Math.round(file.size/1024) + ' KB)';
  const reader=new FileReader();
  reader.onload=ev=>{
    $('imgPreview').src=ev.target.result;
    $('previewFoto').style.display='block';
  };
  reader.readAsDataURL(file);
};


$('btnHoy').onclick=()=>{$('f_fecha').value=today();}
$('btnAyer').onclick=()=>{const d=new Date();d.setDate(d.getDate()-1);$('f_fecha').value=d.toISOString().slice(0,10);};
try{$('f_fecha').setAttribute('max', today());}catch(e){}
  if(token) loadContext(); else { const main=document.querySelector('main'); if(main) main.innerHTML='<section style="padding:60px 0;text-align:center"><h1>Este enlace no funciona</h1><p class="mut">Pida a la familia un enlace nuevo.</p></section>'; }
</script>
</body>
</html>
